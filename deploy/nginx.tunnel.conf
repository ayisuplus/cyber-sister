access_log off;
error_log /dev/null crit;

# 仅由同机 Tunnel 接入；忽略来访请求原有的 X-Forwarded-For 链，避免把整台
# cloudflared 的流量计入同一客户端额度。直接本机预检没有 CF 头时使用实际来源。
map $http_cf_connecting_ip $amie_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name ${APP_DOMAIN};

    # 公网 TLS 由 Cloudflare 终止，同机的 Tunnel → edge 使用回环 HTTP。
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $amie_client_ip;
    proxy_set_header X-Forwarded-For $amie_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    send_timeout 75s;

    location ~ ^/api/chat/conversations/[^/]+/messages/stream$ {
        proxy_pass http://api:3000;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://api:3000;
    }
    location / {
        proxy_pass http://web:8080;
    }
}
