packages:
  - 'apps/*'
  - 'packages/*'
# 2026-11-06 部署复查：锁定传递依赖的安全修补版本。
overrides:
  qs: 6.16.1
  fast-uri: 3.1.9
  ip-address: 10.7.4
# pnpm 11 供应链策略默认拦截 postinstall 构建脚本（strictDepBuilds）。
# v11 已移除 onlyBuiltDependencies，改用 allowBuilds 白名单：
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
