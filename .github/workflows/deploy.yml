name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: '成功的 master push CI 编号；留空自动选择最新成功运行'
        required: false

concurrency:
  group: deploy-private-beta
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: 校验 CI 产物 → 备份 → 发布 → 健康检查
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: private-beta
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy verified CI bundle through restricted SSH
        run: node .github/scripts/deploy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.run_id }}
          AMIE_SSH_HOST: ${{ vars.AMIE_SSH_HOST }}
          AMIE_SSH_PORT: ${{ vars.AMIE_SSH_PORT }}
          AMIE_SSH_USER: ${{ vars.AMIE_SSH_USER }}
          AMIE_SSH_PRIVATE_KEY: ${{ secrets.AMIE_SSH_PRIVATE_KEY }}
          AMIE_SSH_KNOWN_HOSTS: ${{ secrets.AMIE_SSH_KNOWN_HOSTS }}
