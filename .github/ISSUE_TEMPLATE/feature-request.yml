name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：该功能不在 [Spec §1 内测范围](../docs/Spec_Amie_v1.0.md) 之外。
        若属于已明确后置的能力（流式输出、自动记忆、支付、语音等），请在下方注明，我们会归入路线图而非本期实现。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的痛点，而不是直接给方案
      placeholder: 例：聊了很久后，AI 记不住我上周说过的事
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望怎么解决（可选，也许我们有更好的做法）
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - module: chat（聊天）
        - module: tools（工具箱）
        - module: auth（登录/鉴权）
        - module: memories（记忆）
        - module: compliance（危机/合规）
        - module: virtual（虚拟试衣/化妆间）
        - module: docs（文档）
        - module: other
    validations:
      required: true

  - type: dropdown
    id: in-scope
    attributes:
      label: 是否属于内测范围
      description: 参考 docs/Spec_Amie_v1.0.md §1
      options:
        - 属于内测范围
        - 属于后置项（请归入路线图）
        - 不确定，请 triage
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      options:
        - priority: p0（内测必须）
        - priority: p1（强烈建议）
        - priority: p2（锦上添花）
        - 不确定，请 triage
    validations:
      required: false

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规自查（涉及 AI 行为时）
      description: 若本建议涉及 AI 输出、人格或情感交互，请确认
      options:
        - label: 不会弱化 AI 身份标识（用户不会被误导为真人）
        - label: 不涉及医疗诊断、心理咨询或重大人生决策
        - label: 不引入情感诱导或付费绑定
        - label: 不涉及（本建议与 AI 行为无关）
    validations:
      required: false
